name: job-alerts
on:
  schedule:
    - cron: "*/5 * * * *"     # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:

concurrency:
  group: job-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check for new roles
        run: python notifier.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save seen-jobs list
        if: always()
        run: |
          git config user.name "job-alerts"
          git config user.email "job-alerts@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || (git commit -m "update seen jobs" && git pull --rebase -q && git push)
